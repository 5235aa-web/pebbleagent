# CodeAgent - Code Expert Agent

name: code_agent
description: Code expert for programming, debugging, and file operations

# Agent behavior traits
behavior:
  # Professional style, no emotional expression
  professional_tone: true
  # Auto-execute code (no user confirmation)
  auto_execute: false
  # Verbosity level
  verbosity: detailed  # Options: minimal, moderate, detailed

# 工具权限：allowed 为空表示不做白名单过滤（全量工具可用），
# 限制交给权限机制（模式 + 规则 + 路径边界 + 敏感读取拦截）
tools:
  enforce: true
  allowed: []

# System prompt file reference
system_prompt_file: code_agent_prompt.md

# Preloaded Skills
skills:
  - ckb

# Metadata
meta:
  version: "1.1"
  author: "Pebble"
  source: "built-in"
  created_at: "2026-04-08"
  updated_at: "2026-10-16"
