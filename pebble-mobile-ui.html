<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PebbleAgent Mobile</title>
<style>
:root{
  --primary:#FFD700;
  --accent:#FFBF00;
  --border-gold:#CD7F32;
  --text:#FFF8DC;
  --muted:#CC9B1F;
  --label:#DAA520;
  --glow-start:rgba(255,215,0,.10);
  --glow-end:rgba(205,127,50,.04);
  --bg-deep:#0d0d0d;
  --bg-surface:#111111;
  --bg-card:#1a1a1a;
  --bg-hover:#222222;
  --bg-input:#0a0a0a;
  --border-subtle:#2a2a2a;
  --border-hover:#3a3a3a;
  --text-body:#d4d4d4;
  --success:#4caf50;
  --error:#ef5350;
  --warn:#ffa726;
  --info:#44aaff;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',ui-monospace,monospace;
  --spring:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#070707;color:var(--text);font-family:var(--font-mono);font-size:13px;line-height:1.5}
body{
  min-height:100vh;
  padding:44px 28px 72px;
  background:
    radial-gradient(900px 520px at 12% -8%,rgba(255,215,0,.06),transparent 62%),
    radial-gradient(760px 460px at 88% 108%,rgba(205,127,50,.05),transparent 60%),
    #070707;
}

/* ===== stage ===== */
.stage{max-width:1560px;margin:0 auto}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px;padding-bottom:20px;border-bottom:1px solid var(--border-subtle)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-gold);background:linear-gradient(160deg,rgba(255,215,0,.14),rgba(205,127,50,.04));display:grid;place-items:center;color:var(--accent);box-shadow:0 0 0 1px rgba(255,191,0,.06) inset,0 6px 18px rgba(0,0,0,.5)}
.brand-txt{display:flex;flex-direction:column;gap:2px}
.brand-txt b{font-size:15px;letter-spacing:.4px;color:var(--text);font-weight:600}
.brand-txt span{font-size:10.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}
.stage-meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border-subtle);border-radius:999px;padding:4px 11px;font-size:10.5px;color:var(--muted);background:var(--bg-surface);letter-spacing:.3px}
.chip-dot{display:inline-flex;align-items:center;gap:6px;border-color:rgba(76,175,80,.28);color:#7fd07f;background:rgba(76,175,80,.07)}
.chip-dot i{width:5px;height:5px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}

/* ===== screens grid ===== */
.screens{display:flex;gap:38px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
figure.phone{display:flex;flex-direction:column;align-items:center;gap:14px}
.frame{
  width:393px;height:851px;border-radius:46px;
  padding:3px;
  background:linear-gradient(170deg,#2c2c2c,#141414 42%,#242424);
  box-shadow:0 30px 70px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.03) inset;
  position:relative;
}
.frame::after{content:"";position:absolute;inset:3px;border-radius:43px;box-shadow:0 0 0 1px rgba(0,0,0,.9) inset;pointer-events:none}
.screen{
  position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;
  background:var(--bg-deep);
  display:flex;flex-direction:column;
  isolation:isolate;
}
.screen::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(520px 220px at 50% -10%,rgba(255,215,0,.055),transparent 70%);
}
figcaption{font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}

/* ===== status bar ===== */
.statusbar{
  position:relative;z-index:3;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:11px;color:var(--text-body);letter-spacing:.4px;
}
.status-right{display:flex;align-items:center;gap:5px}
.sig{display:flex;align-items:flex-end;gap:1.5px;height:9px}
.sig i{width:2.5px;background:var(--text-body);border-radius:1px}
.sig i:nth-child(1){height:3px}
.sig i:nth-child(2){height:5px}
.sig i:nth-child(3){height:7px}
.sig i:nth-child(4){height:9px;opacity:.32}
.batt{width:20px;height:10px;border:1px solid var(--text-body);border-radius:3px;position:relative;padding:1.5px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:var(--text-body);border-radius:0 1px 1px 0}
.batt i{display:block;height:100%;width:64%;background:var(--text-body);border-radius:1px}

/* ===== app bar ===== */
.appbar{
  position:relative;z-index:3;flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:6px 16px 12px;
  border-bottom:1px solid var(--border-subtle);
  background:linear-gradient(180deg,rgba(17,17,17,.92),rgba(13,13,13,.72));
  backdrop-filter:blur(8px);
}
.appbar-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.appbar-title b{font-size:13.5px;font-weight:600;color:var(--text);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title span{font-size:10px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:32px;height:32px;flex:0 0 32px;border:1px solid var(--border-subtle);border-radius:9px;
  background:var(--bg-surface);color:var(--text-body);
  display:grid;place-items:center;cursor:pointer;transition:all .15s var(--spring);
}
.iconbtn:hover{background:var(--bg-hover);border-color:var(--border-hover);color:var(--text)}
.iconbtn.on{color:var(--accent);border-color:rgba(255,191,0,.3);background:rgba(255,191,0,.08)}
.appbar-leading{display:flex;align-items:center;gap:9px}
.amodel{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:2px;padding:2px 7px 2px 6px;border-radius:999px;border:1px solid rgba(255,191,0,.22);background:rgba(255,191,0,.07);color:var(--accent);font-family:var(--font-mono);font-size:9.5px;letter-spacing:.4px;cursor:pointer;transition:all .14s var(--spring)}
.amodel svg{opacity:.65;flex:0 0 auto}
.amodel:active{background:rgba(255,191,0,.16);border-color:rgba(255,191,0,.4)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 7px rgba(76,175,80,.9);flex:0 0 6px}

/* ===== generic body ===== */
.body{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px 18px}
.scroll::-webkit-scrollbar{width:0}

.sec-label{font-size:9.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:14px 4px 7px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--border-subtle),transparent)}

/* ===== search ===== */
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border:1px solid var(--border-subtle);border-radius:9px;background:var(--bg-surface);color:var(--muted);font-size:11.5px}
.search svg{flex:0 0 13px;opacity:.7}

/* ===== session rows ===== */
.sess{
  display:flex;align-items:flex-start;gap:10px;
  padding:11px 11px;border-radius:10px;border:1px solid transparent;
  cursor:pointer;transition:all .14s var(--spring);margin-bottom:2px;
}
.sess:hover{background:var(--bg-surface);border-color:var(--border-subtle)}
.sess.active{background:linear-gradient(100deg,rgba(255,191,0,.10),rgba(255,191,0,.03));border-color:rgba(255,191,0,.26)}
.sess.active .sess-title{color:var(--accent)}
.sess-bar{width:2px;flex:0 0 2px;align-self:stretch;border-radius:2px;background:transparent}
.sess.active .sess-bar{background:var(--accent);box-shadow:0 0 8px rgba(255,191,0,.7)}
.sess-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sess-title{font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.sess-sub{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;letter-spacing:.2px}
.sess-sub em{font-style:normal;width:1px;height:8px;background:var(--border-subtle)}
.sess-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.sess-time{font-size:9.5px;color:#6f6f6f}
.badge-unread{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:rgba(255,191,0,.16);border:1px solid rgba(255,191,0,.34);color:var(--accent);font-size:9px;display:grid;place-items:center;font-weight:600}
.badge-wait{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.34);color:#ff8a88;font-size:9px;letter-spacing:.3px}

.fab{
  position:absolute;right:18px;bottom:78px;z-index:6;
  width:50px;height:50px;border-radius:16px;border:1px solid rgba(255,191,0,.34);
  background:linear-gradient(150deg,rgba(255,215,0,.20),rgba(205,127,50,.10));
  color:var(--accent);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 12px 28px rgba(0,0,0,.6),0 0 0 1px rgba(255,191,0,.10) inset;
}

/* ===== bottom nav ===== */
.navbar{
  position:relative;z-index:5;flex:0 0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--border-subtle);
  background:rgba(13,13,13,.94);backdrop-filter:blur(12px);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 4px;color:#6f6f6f;cursor:pointer;position:relative;transition:color .15s}
.nav svg{width:19px;height:19px}
.nav span{font-size:9px;letter-spacing:.5px}
.nav.on{color:var(--accent)}
.nav.on::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 9px rgba(255,191,0,.85)}
.nav .cnt{position:absolute;top:1px;right:calc(50% - 19px);min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--error);color:#fff;font-size:8.5px;display:grid;place-items:center;font-weight:600}

/* ===== chat ===== */
.chat{padding:16px 14px 10px;display:flex;flex-direction:column;gap:13px}
.tstamp{align-self:center;font-size:9px;color:#5f5f5f;letter-spacing:1.4px;padding:2px 0 4px}
.msg-user{
  align-self:flex-end;max-width:84%;
  background:linear-gradient(160deg,rgba(255,191,0,.15),rgba(255,191,0,.07));
  border:1px solid rgba(255,191,0,.24);border-radius:14px 14px 4px 14px;
  padding:9px 12px;font-size:12px;line-height:1.62;color:var(--text);
}
.think{
  align-self:flex-start;width:100%;border:1px solid var(--border-subtle);border-radius:10px;
  background:var(--bg-surface);overflow:hidden;
}
.think-h{display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:10.5px;color:var(--muted);letter-spacing:.3px}
.think-h svg{flex:0 0 12px;opacity:.75}
.think-h .arw{margin-left:auto;opacity:.5}
.think-h b{font-weight:500;color:#b9b9b9}

.tool{
  align-self:flex-start;width:100%;
  border:1px solid var(--border-subtle);border-radius:10px;background:var(--bg-card);
  overflow:hidden;
}
.tool-h{display:flex;align-items:center;gap:8px;padding:9px 11px}
.tool-ico{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;background:rgba(255,191,0,.10);border:1px solid rgba(255,191,0,.22);color:var(--accent)}
.tool-ico.ok{background:rgba(76,175,80,.10);border-color:rgba(76,175,80,.26);color:#6fce73}
.tool-ico.run{background:rgba(68,170,255,.10);border-color:rgba(68,170,255,.26);color:#6cb8ff}
.tool-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tool-name{font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-meta{font-size:9.5px;color:var(--muted);letter-spacing:.2px}
.tool-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.tool-dur{font-size:9.5px;color:#6f6f6f}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(68,170,255,.25);border-top-color:#6cb8ff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.md{align-self:flex-start;max-width:100%;font-size:12.5px;line-height:1.72;color:var(--text-body)}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md code{font-family:var(--font-mono);font-size:11.5px;background:rgba(255,191,0,.10);border:1px solid rgba(255,191,0,.16);border-radius:4px;padding:1px 4px;color:var(--accent)}
.code{
  margin-top:9px;border:1px solid var(--border-subtle);border-radius:9px;overflow:hidden;background:#080808;
}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--border-subtle);background:var(--bg-surface);font-size:9.5px;color:var(--muted);letter-spacing:.6px}
.code pre{padding:10px 11px;font-size:11px;line-height:1.62;overflow-x:auto;color:#cfcfcf}
.code pre::-webkit-scrollbar{height:0}
.kw{color:#ff9d5c}
.fn{color:#8fd0ff}
.st{color:#a8d98a}
.cm{color:#5f5f5f;font-style:italic}
.cursor{display:inline-block;width:6px;height:12px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(2) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ===== composer ===== */
.composer{
  position:relative;z-index:5;flex:0 0 auto;
  border-top:1px solid var(--border-subtle);
  background:rgba(13,13,13,.96);backdrop-filter:blur(12px);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
}
.comp-row{display:flex;align-items:flex-end;gap:7px}
.comp-box{
  flex:1;min-height:38px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-input);
  padding:8px 10px;
}
.comp-box .ph{font-size:11.5px;color:#5f5f5f;flex:1}
.comp-tools{display:flex;gap:5px;flex:0 0 auto}
.tool-mini{width:26px;height:26px;border-radius:7px;border:1px solid transparent;background:transparent;color:#7a7a7a;display:grid;place-items:center;cursor:pointer}
.tool-mini:hover{background:var(--bg-hover);color:var(--text-body)}
.send{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;border:1px solid rgba(255,191,0,.3);
  background:linear-gradient(150deg,rgba(255,215,0,.20),rgba(205,127,50,.10));
  color:var(--accent);display:grid;place-items:center;cursor:pointer;
}
.send.stop{border-color:rgba(239,83,80,.34);background:rgba(239,83,80,.12);color:#ff8a88}
.comp-progress{height:2px;border-radius:2px;background:rgba(255,191,0,.12);overflow:hidden;margin-bottom:7px}
.comp-progress i{display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}

/* ===== permission sheet ===== */
.veil{position:absolute;inset:0;z-index:8;background:rgba(4,4,4,.74);backdrop-filter:blur(3px)}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:9;
  border-radius:20px 20px 0 0;
  border-top:1px solid rgba(239,83,80,.24);
  background:linear-gradient(180deg,#161616,#0f0f0f 42%);
  box-shadow:0 -22px 60px rgba(0,0,0,.8);
  padding:9px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:13px;
  animation:sheet-in .32s var(--spring);
}
@keyframes sheet-in{from{transform:translateY(28px);opacity:.6}to{transform:translateY(0);opacity:1}}
.grab{width:36px;height:3.5px;border-radius:2px;background:#3a3a3a;margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;gap:9px}
.shield{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.3);color:#ff8a88}
.sheet-h-txt{flex:1;display:flex;flex-direction:column;gap:1px}
.sheet-h-txt b{font-size:13px;color:var(--text)}
.sheet-h-txt span{font-size:9.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.risk{padding:3px 8px;border-radius:6px;font-size:9px;letter-spacing:.6px;background:rgba(239,83,80,.13);border:1px solid rgba(239,83,80,.34);color:#ff8a88;text-transform:uppercase}

.kv{display:flex;flex-direction:column;gap:9px;border:1px solid var(--border-subtle);border-radius:11px;background:var(--bg-surface);padding:11px 12px}
.kv-row{display:flex;flex-direction:column;gap:2px}
.kv-k{font-size:9px;color:#6f6f6f;letter-spacing:1.2px;text-transform:uppercase}
.kv-v{font-size:11.5px;color:var(--text-body);word-break:break-all;line-height:1.5}
.kv-v.path{color:var(--accent)}
.kv-v.reason{color:#b9b9b9}

.rem{display:flex;flex-direction:column;gap:7px}
.rem-lbl{font-size:9px;color:#6f6f6f;letter-spacing:1.2px;text-transform:uppercase}
.chips{display:flex;gap:7px}
.chip-o{flex:1;text-align:center;padding:7px 0;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--muted);font-size:10.5px;cursor:pointer;transition:all .14s}
.chip-o:hover{border-color:var(--border-hover);color:var(--text-body)}
.chip-o.on{border-color:rgba(255,191,0,.4);background:rgba(255,191,0,.10);color:var(--accent)}

.acts{display:flex;gap:9px}
.btn{
  flex:1;height:42px;border-radius:11px;border:1px solid var(--border-subtle);
  background:var(--bg-surface);color:var(--text-body);font-family:var(--font-mono);
  font-size:12px;cursor:pointer;display:grid;place-items:center;transition:all .14s var(--spring);
}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover);color:var(--text)}
.btn-deny{border-color:rgba(239,83,80,.3);background:rgba(239,83,80,.08);color:#ff8a88}
.btn-deny:hover{background:rgba(239,83,80,.16);border-color:rgba(239,83,80,.5)}
.btn-allow{border-color:rgba(255,191,0,.34);background:linear-gradient(150deg,rgba(255,215,0,.18),rgba(205,127,50,.09));color:var(--accent)}
.btn-allow:hover{background:linear-gradient(150deg,rgba(255,215,0,.26),rgba(205,127,50,.13))}
.btn-sub{height:34px;border:none;background:transparent;color:var(--muted);font-size:10.5px;letter-spacing:.4px;cursor:pointer}
.btn-sub:hover{color:var(--accent)}

/* ===== changes ===== */
.sum{display:flex;align-items:center;gap:14px;border:1px solid var(--border-subtle);border-radius:11px;background:var(--bg-surface);padding:11px 13px;margin-bottom:4px}
.sum-main{flex:1;display:flex;flex-direction:column;gap:2px}
.sum-main b{font-size:13px;color:var(--text)}
.sum-main span{font-size:9.5px;color:var(--muted);letter-spacing:.3px}
.sum-num{display:flex;gap:11px;font-size:12px}
.sum-num .add{color:#6fce73}
.sum-num .del{color:#ff8a88}

.fchg{
  display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:10px;
  border:1px solid transparent;cursor:pointer;margin-bottom:2px;transition:all .14s var(--spring);
}
.fchg:hover{background:var(--bg-surface);border-color:var(--border-subtle)}
.fchg.on{background:linear-gradient(100deg,rgba(255,191,0,.09),rgba(255,191,0,.02));border-color:rgba(255,191,0,.24)}
.fchg-ico{width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-subtle);color:var(--muted);font-size:8.5px;letter-spacing:.2px}
.fchg.on .fchg-ico{color:var(--accent);border-color:rgba(255,191,0,.3);background:rgba(255,191,0,.09)}
.fchg-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fchg-name{font-size:11.5px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchg.on .fchg-name{color:var(--text)}
.fchg-path{font-size:9px;color:#6f6f6f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchg-num{display:flex;gap:7px;font-size:10.5px;flex:0 0 auto}
.fchg-num .add{color:#6fce73}
.fchg-num .del{color:#ff8a88}

.diff{margin-top:10px;border:1px solid var(--border-subtle);border-radius:10px;overflow:hidden;background:#080808}
.diff-h{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--bg-surface);border-bottom:1px solid var(--border-subtle);font-size:9.5px;color:var(--muted);letter-spacing:.5px}
.diff-body{font-size:10.5px;line-height:1.68;overflow-x:auto}
.diff-body::-webkit-scrollbar{height:0}
.dl{display:flex;padding:0 11px;white-space:pre}
.dl .ln{flex:0 0 22px;color:#4a4a4a;text-align:right;padding-right:9px;user-select:none}
.dl.add{background:rgba(76,175,80,.09)}
.dl.add .sign{color:#6fce73;flex:0 0 11px}
.dl.del{background:rgba(239,83,80,.09)}
.dl.del .sign{color:#ff8a88;flex:0 0 11px}
.dl.ctx .sign{color:#3a3a3a;flex:0 0 11px}
.dl .tx{color:#b9b9b9}

.chg-foot{
  position:relative;z-index:5;flex:0 0 auto;display:flex;gap:9px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border-subtle);background:rgba(13,13,13,.95);backdrop-filter:blur(12px);
}

/* ===== usage ===== */
.kpi{
  border:1px solid rgba(255,191,0,.18);border-radius:13px;
  background:linear-gradient(150deg,rgba(255,191,0,.10),rgba(205,127,50,.03));
  padding:16px 15px 14px;margin-bottom:12px;
}
.kpi-l{font-size:9px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.kpi-v{margin-top:6px;font-size:31px;line-height:1.05;color:var(--primary);letter-spacing:-1px;font-weight:600}
.kpi-v small{font-size:13px;color:var(--muted);letter-spacing:0;margin-left:3px;font-weight:400}
.kpi-sub{margin-top:7px;font-size:10px;color:#7a7a7a;display:flex;align-items:center;gap:6px}
.kpi-g{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:14px;border-top:1px solid rgba(255,191,0,.14);padding-top:12px}
.kpi-c{display:flex;flex-direction:column;gap:3px;text-align:center}
.kpi-c+.kpi-c{border-left:1px solid rgba(255,191,0,.12)}
.kpi-c b{font-size:13px;color:var(--text);font-weight:600}
.kpi-c span{font-size:8.5px;letter-spacing:.8px;color:#6f6f6f;text-transform:uppercase}

.chips{display:flex;gap:7px;margin:0 0 11px}
.calls{border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-surface);overflow:hidden}
.call{display:flex;align-items:center;gap:9px;padding:10px 12px}
.call+.call{border-top:1px solid var(--border-subtle)}
.call-t{width:34px;flex:0 0 34px;font-size:9px;color:#6f6f6f;letter-spacing:.2px}
.call-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.call-m{font-size:11px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-tk{font-size:9px;color:#6f6f6f;letter-spacing:.2px}
.call-cost{font-size:11px;color:var(--accent);flex:0 0 auto}

.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:66px;flex:0 0 66px;font-size:9.5px;color:var(--muted)}
.bar-track{flex:1;height:6px;border-radius:3px;background:var(--bg-card);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--border-gold),var(--accent))}
.bar-num{width:54px;flex:0 0 54px;text-align:right;font-size:9.5px;color:var(--text-body)}

/* ===== model sheet ===== */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
.sheet{background:var(--bg-surface);border-top:1px solid var(--border-subtle);border-radius:18px 18px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));box-shadow:0 -18px 40px rgba(0,0,0,.6)}
.sheet-grip{width:34px;height:4px;border-radius:2px;background:#333;margin:0 auto 10px}
.sheet-h{display:flex;align-items:baseline;gap:8px;padding:0 16px 10px}
.sheet-h b{font-size:12.5px;color:var(--text);font-weight:600}
.sheet-h span{font-size:9px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer}
.mrow+.mrow{border-top:1px solid var(--border-subtle)}
.mrow.on{background:rgba(255,191,0,.06)}
.mrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow-main b{font-size:12px;color:var(--text-body);font-weight:500}
.mrow-main span{font-size:9.5px;color:#6f6f6f;letter-spacing:.2px}
.mrow.on .mrow-main b{color:var(--text)}
.mrow-ck{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:1px solid var(--border-hover);display:grid;place-items:center;color:transparent}
.mrow.on .mrow-ck{border-color:var(--accent);background:rgba(255,191,0,.15);color:var(--accent)}
.agents{display:flex;gap:7px;padding:0 16px 12px}
.ag{flex:1;text-align:center;padding:8px 0;border-radius:9px;border:1px solid var(--border-subtle);background:var(--bg-card);color:var(--muted);font-size:10.5px;cursor:pointer;transition:all .14s var(--spring)}
.ag.on{border-color:rgba(255,191,0,.4);background:rgba(255,191,0,.10);color:var(--accent)}
.ag small{display:block;font-size:8px;letter-spacing:.6px;color:#6f6f6f;margin-top:2px}
.ag.on small{color:rgba(255,191,0,.7)}

/* ===== settings / connection ===== */
.card{border:1px solid var(--border-subtle);border-radius:12px;background:var(--bg-surface);overflow:hidden;margin-bottom:11px}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border-subtle);background:rgba(26,26,26,.5)}
.card-h b{font-size:11.5px;color:var(--text);font-weight:500;letter-spacing:.2px}
.card-h .sp{margin-left:auto}
.card-b{padding:13px}
.state{display:flex;align-items:center;gap:10px}
.state-ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.28);color:#6fce73}
.state-main{flex:1;display:flex;flex-direction:column;gap:2px}
.state-main b{font-size:12.5px;color:var(--text)}
.state-main span{font-size:10px;color:var(--muted)}
.pill{padding:3px 8px;border-radius:6px;font-size:9px;letter-spacing:.5px;background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.3);color:#6fce73}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field label{font-size:9px;color:#6f6f6f;letter-spacing:1.2px;text-transform:uppercase}
.inp{height:38px;display:flex;align-items:center;padding:0 11px;border:1px solid var(--border-subtle);border-radius:9px;background:var(--bg-input);font-size:12px;color:var(--text)}
.inp.dim{color:#7a7a7a}
.inp-split{display:flex;gap:9px}
.inp-split .field{flex:1}
.row{display:flex;align-items:center;gap:10px;padding:11px 0}
.row+.row{border-top:1px solid var(--border-subtle)}
.row:first-child{padding-top:0}
.row:last-child{padding-bottom:0}
.row-ico{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-subtle);color:var(--muted)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-size:11.5px;color:var(--text-body);font-weight:500}
.row-main span{font-size:9.5px;color:#6f6f6f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-val{font-size:11px;color:var(--muted);flex:0 0 auto}
.tgl{width:38px;height:21px;border-radius:11px;background:#2a2a2a;position:relative;flex:0 0 38px;transition:background .18s}
.tgl::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#6f6f6f;transition:all .18s var(--spring)}
.tgl.on{background:rgba(255,191,0,.28)}
.tgl.on::after{left:19.5px;background:var(--accent);box-shadow:0 0 8px rgba(255,191,0,.6)}
.scan{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:9px;border:1px dashed rgba(255,191,0,.32);background:rgba(255,191,0,.05);color:var(--accent);font-size:11.5px;cursor:pointer}

.swatches{display:flex;gap:9px;padding-top:3px}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.1);cursor:pointer;position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--accent)}

.hint{display:flex;align-items:flex-start;gap:7px;padding:9px 11px;border-radius:9px;border:1px solid rgba(255,167,38,.24);background:rgba(255,167,38,.06);font-size:10px;line-height:1.55;color:#d9a860}
.hint svg{flex:0 0 12px;margin-top:1px;opacity:.85}

/* ===== inbox ===== */
.inbox-item{
  display:flex;gap:10px;padding:12px 11px;border-radius:11px;border:1px solid var(--border-subtle);
  background:var(--bg-surface);margin-bottom:7px;cursor:pointer;transition:all .14s var(--spring);
}
.inbox-item:hover{border-color:var(--border-hover);background:var(--bg-card)}
.inbox-item.hot{border-color:rgba(239,83,80,.28);background:linear-gradient(100deg,rgba(239,83,80,.07),transparent)}
.inbox-ico{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,191,0,.09);border:1px solid rgba(255,191,0,.22);color:var(--accent)}
.inbox-ico.hot{background:rgba(239,83,80,.1);border-color:rgba(239,83,80,.3);color:#ff8a88}
.inbox-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.inbox-top{display:flex;align-items:center;gap:7px}
.inbox-top b{font-size:12px;color:var(--text);font-weight:500}
.inbox-top .t{margin-left:auto;font-size:9px;color:#5f5f5f}
.inbox-desc{font-size:10.5px;color:var(--muted);line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-tag{align-self:flex-start;padding:2px 6px;border-radius:5px;font-size:8.5px;letter-spacing:.4px;background:rgba(255,191,0,.1);border:1px solid rgba(255,191,0,.22);color:var(--accent)}
.inbox-tag.hot{background:rgba(239,83,80,.1);border-color:rgba(239,83,80,.28);color:#ff8a88}

.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:44px 20px;color:#5f5f5f;text-align:center}
.empty svg{width:34px;height:34px;opacity:.35}
.empty b{font-size:11.5px;color:#7a7a7a;font-weight:500}
.empty span{font-size:10px;line-height:1.6}

/* ===== language switch ===== */
.lang-switch{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-surface)}
.lang-btn{padding:4px 13px;border:none;border-radius:999px;background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.5px;cursor:pointer;transition:all .16s var(--spring)}
.lang-btn:hover{color:var(--text)}
.lang-btn.on{background:linear-gradient(150deg,rgba(255,215,0,.2),rgba(205,127,50,.1));color:var(--accent);box-shadow:0 0 0 1px rgba(255,191,0,.28) inset}

/* ===== connection state bar ===== */
.conn-bar{
  position:relative;z-index:2;flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:7px 16px;font-size:10.5px;letter-spacing:.2px;
  border-bottom:1px solid var(--border-subtle);
  animation:conn-in .28s var(--spring);
}
@keyframes conn-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.conn-warn{background:rgba(255,167,38,.10);border-bottom-color:rgba(255,167,38,.26);color:#ffc16b}
.conn-err{background:rgba(239,83,80,.10);border-bottom-color:rgba(239,83,80,.30);color:#ff8a88}
.conn-ok{background:rgba(76,175,80,.09);border-bottom-color:rgba(76,175,80,.26);color:#6fce73}
.conn-bar b{font-weight:600;letter-spacing:.3px}
.conn-bar .cb-ring{width:11px;height:11px;flex:0 0 11px;border-radius:50%;border:1.5px solid currentColor;border-top-color:transparent;animation:spin .9s linear infinite}
.conn-bar .cb-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.conn-bar .cb-right{margin-left:auto;font-size:9.5px;opacity:.8;letter-spacing:.6px;white-space:nowrap}

/* ===== clarify card ===== */
.clarify{
  align-self:flex-start;width:100%;overflow:hidden;
  border:1px solid rgba(255,191,0,.28);border-radius:12px;
  background:linear-gradient(168deg,rgba(255,191,0,.055),rgba(205,127,50,.015));
}
.clarify-h{display:flex;align-items:center;gap:9px;padding:11px 12px 0}
.clarify-ico{width:26px;height:26px;flex:0 0 26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,191,0,.14);border:1px solid rgba(255,191,0,.32);color:var(--accent)}
.clarify-h-txt{flex:1;display:flex;flex-direction:column;gap:1px}
.clarify-h-txt b{font-size:12px;color:var(--text);font-weight:600}
.clarify-h-txt span{font-size:9px;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase}
.clarify-badge{min-width:18px;height:18px;padding:0 5px;border-radius:6px;display:grid;place-items:center;background:rgba(255,191,0,.14);border:1px solid rgba(255,191,0,.3);color:var(--accent);font-size:9.5px}
.clarify-q{padding:9px 12px 11px;font-size:12px;line-height:1.65;color:var(--text-body)}
.clarify-opts{display:flex;flex-direction:column;gap:7px;padding:0 12px}
.opt{display:flex;gap:9px;padding:10px 11px;border:1px solid var(--border-subtle);border-radius:10px;background:var(--bg-surface);cursor:pointer;transition:all .14s var(--spring)}
.opt:hover{border-color:var(--border-hover);background:var(--bg-hover)}
.opt.on{border-color:rgba(255,191,0,.48);background:rgba(255,191,0,.085);box-shadow:0 0 0 1px rgba(255,191,0,.16) inset}
.opt-mark{width:15px;height:15px;flex:0 0 15px;border-radius:50%;border:1.6px solid #4a4a4a;margin-top:1px;position:relative;transition:all .14s var(--spring)}
.opt.on .opt-mark{border-color:var(--accent)}
.opt.on .opt-mark::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(255,191,0,.75)}
.opt.sq .opt-mark{border-radius:4px}
.opt.sq.on .opt-mark::after{border-radius:2px}
.opt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt-main b{font-size:11.5px;color:var(--text);font-weight:500}
.opt.on .opt-main b{color:var(--accent)}
.opt-main span{font-size:10px;line-height:1.5;color:#8a8a8a}
.clarify-foot{display:flex;gap:8px;padding:12px;margin-top:12px;border-top:1px solid rgba(255,191,0,.14);background:rgba(10,10,10,.35)}
.clarify-foot .btn{height:38px;font-size:11.5px}

/* ===== pairing ===== */
.pair{flex:1;min-height:0;display:flex;flex-direction:column;gap:15px;padding:6px 24px 22px;overflow-y:auto}
.pair::-webkit-scrollbar{width:0}
.pair-top{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;padding-top:10px}
.pair-top b{font-size:17px;font-weight:600;color:var(--text);letter-spacing:.2px}
.pair-top span{font-size:11px;line-height:1.68;color:#8a8a8a;max-width:272px}
.qr-wrap{position:relative;align-self:center;width:192px;height:192px;padding:13px;border-radius:16px;background:#090909;border:1px solid var(--border-subtle);box-shadow:0 0 0 1px rgba(255,191,0,.07) inset,0 16px 36px rgba(0,0,0,.65)}
.qr-wrap svg{width:100%;height:100%;display:block}
.qr-corner{position:absolute;width:20px;height:20px;border:2px solid var(--accent);opacity:.85}
.qr-corner.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-radius:9px 0 0 0}
.qr-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-radius:0 9px 0 0}
.qr-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-radius:0 0 0 9px}
.qr-corner.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-radius:0 0 9px 0}
.pair-div{display:flex;align-items:center;gap:10px;color:#5f5f5f;font-size:9px;letter-spacing:1.7px;text-transform:uppercase}
.pair-div::before,.pair-div::after{content:"";flex:1;height:1px;background:var(--border-subtle)}
.pair-btn{width:100%;height:44px;flex:0 0 auto;font-size:12.5px}
.pair-note{display:flex;gap:7px;padding:0 2px;font-size:9.5px;line-height:1.62;color:#6f6f6f}
.pair-note svg{flex:0 0 12px;width:12px;height:12px;margin-top:1px;color:var(--muted)}

@media (max-width:900px){
  body{padding:24px 14px 48px}
  .screens{gap:26px}
  .frame{transform-origin:top center}
}
</style>

/* ===== pairing QR (decorative, deterministic) ===== */
(function drawQR(){
  var svg = document.getElementById('qrArt');
  if (!svg) return;
  var NS = 'http://www.w3.org/2000/svg';
  var N = 29;
  var seed = 20261022;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function finder(r, c){
    var boxes = [[0,0],[0,N-7],[N-7,0]];
    for (var i = 0; i < boxes.length; i++){
      var r0 = boxes[i][0], c0 = boxes[i][1];
      if (r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7){
        var dr = r - r0, dc = c - c0;
        return (dr === 0 || dr === 6 || dc === 0 || dc === 6) || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
      }
    }
    return null;
  }
  var frag = document.createDocumentFragment();
  for (var r = 0; r < N; r++){
    for (var c = 0; c < N; c++){
      var f = finder(r, c);
      var on;
      if (f !== null){ on = f; }
      else {
        var near = (r < 9 && c < 9) || (r < 9 && c > N - 10) || (r > N - 10 && c < 9);
        on = near ? false : rnd() > 0.5;
      }
      if (!on) continue;
      var rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', c);
      rect.setAttribute('y', r);
      rect.setAttribute('width', 1.02);
      rect.setAttribute('height', 1.02);
      rect.setAttribute('fill', '#dcd6c4');
      frag.appendChild(rect);
    }
  }
  svg.appendChild(frag);
})();

  var nodes = [];
  function collect(){
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        var p = n.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('.msg-user, .tstamp, script, style')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    while (walker.nextNode()) nodes.push(walker.currentNode);
  }
  function apply(lang){
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      if (n.__base === undefined) n.__base = n.nodeValue;
      var key = n.__base.trim();
      if (!key || !DICT[key]) continue;
      n.nodeValue = lang === 'cn' ? DICT[key] : n.__base;
    }
    document.documentElement.lang = lang === 'cn' ? 'zh-CN' : 'en';
    var btns = document.querySelectorAll('.lang-btn');
    for (var j = 0; j < btns.length; j++){
      btns[j].classList.toggle('on', btns[j].getAttribute('data-lang') === lang);
    }
  }
  collect();
  var btns = document.querySelectorAll('.lang-btn');
  for (var k = 0; k < btns.length; k++){

    });
  }
})();
