[package]
name = "pebble-orbit-shell"
version = "0.1.0"
description = "Pebble Orbit desktop shell"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# The library name stays `app_lib` so `main.rs` and the mobile entry point keep
# working unchanged; only the package name differs, which is what keeps this
# crate from colliding with the ui-gui-vue3 shell in a shared cargo target.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
