<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Pebble Agent — Orbit</title>
<style>
/* The splash is inlined here on purpose: it has to paint before the module graph
   loads, so it cannot live in a stylesheet the shell fetches afterwards. It also
   keeps its own pure black palette instead of following `data-theme` — a white flash
   before the shell is up would defeat the point. */
#splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background: #000000;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  opacity: 1;
  transition: opacity .65s cubic-bezier(.22, 1, .36, 1);
}
#splash.sp-out {
  opacity: 0;
  pointer-events: none;
}

#splash .sp-shell {
  width: min(68vw, 680px);
  max-width: 90vw;
  display: grid;
  justify-items: center;
  gap: 36px;
  transition: transform .7s cubic-bezier(.22, 1, .36, 1),
              opacity .65s cubic-bezier(.22, 1, .36, 1);
}
#splash.sp-done .sp-shell {
  transform: scale(1.025);
  opacity: 0;
}

#splash .sp-wordmark {
  width: 100%;
  display: grid;
  place-items: center;
}

#splash svg.sp-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

/* Soft outer aura under the crisp white single-stroke calligraphy */
#splash .sp-glow-layer path {
  fill: none;
  stroke: rgba(255, 255, 255, .24);
  stroke-width: 7.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: blur(4px);
}

/* Crisp pure white single-stroke artistic lettering */
#splash .sp-ink-layer path {
  fill: none;
  stroke: #ffffff;
  stroke-width: 3.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Subtle serene breathing after writing finishes while waiting on gateway */
#splash .sp-shell.sp-written .sp-ink-layer {
  animation: sp-pulse 2.8s ease-in-out infinite;
}
@keyframes sp-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .82; }
}

/* Loading indicator shown beneath PEBBLE once writing finishes */
#splash .sp-loading {
  display: grid;
  justify-items: center;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .55s cubic-bezier(.22, 1, .36, 1),
              transform .55s cubic-bezier(.22, 1, .36, 1);
  pointer-events: none;
}
#splash .sp-shell.sp-written .sp-loading {
  opacity: 1;
  transform: translateY(0);
}

#splash .sp-load-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
#splash .sp-load-text {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .44em;
  text-indent: .44em;
  color: rgba(255, 255, 255, .78);
}
#splash .sp-dots {
  display: inline-flex;
  align-items: center;
  gap: 4.5px;
}
#splash .sp-dots i {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .9);
  opacity: .25;
  animation: sp-dot 1.2s ease-in-out infinite;
}
#splash .sp-dots i:nth-child(2) { animation-delay: .2s; }
#splash .sp-dots i:nth-child(3) { animation-delay: .4s; }
@keyframes sp-dot {
  0%, 80%, 100% { opacity: .2; transform: scale(.85); }
  40%           { opacity: .95; transform: scale(1.15); }
}

/* Pen-tip light flare tracking the active stroke */
#splash .sp-nib {
  opacity: 0;
  transition: opacity .18s ease;
  pointer-events: none;
}
#splash .sp-nib.is-active {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  #splash .sp-shell.sp-written .sp-ink-layer,
  #splash .sp-dots i { animation: none !important; }
  #splash .sp-dots i { opacity: .65; }
}
</style>
</head>
<body>

<div id="splash" aria-label="PEBBLE">
  <div class="sp-shell">
    <div class="sp-wordmark">
      <svg class="sp-svg" viewBox="0 0 498 150" aria-hidden="true">
        <defs>
          <radialGradient id="sp-nib-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Glow mirror paths (synced dynamically with ink paths) -->
        <g class="sp-glow-layer"></g>

        <!-- Artistic single-stroke letterforms: P E B B L E -->
        <g class="sp-ink-layer">
          <!-- P -->
          <path data-ch="P" transform="translate(46, 0)"
            d="M 1 111 Q 7 111 9 104 C 12 80 16 52 19 34 C 45 29 61 36 58 52 C 55 68 35 73 14 72" />
          <!-- E -->
          <path data-ch="E" transform="translate(116, 0)"
            d="M 54 38 C 42 31 24 31 18 37 C 13 43 12 57 12 70 Q 28 68 42 70 Q 28 68 12 70 C 9 85 7 100 13 106 C 22 113 42 111 55 103" />
          <!-- B -->
          <path data-ch="B" transform="translate(186, 0)"
            d="M 6 110 C 10 82 14 55 18 34 C 39 29 52 35 50 47 C 48 59 34 66 13 68 C 40 67 57 74 54 91 C 51 106 32 112 6 110" />
          <!-- B -->
          <path data-ch="B" transform="translate(258, 0)"
            d="M 6 110 C 10 82 14 55 18 34 C 39 29 52 35 50 47 C 48 59 34 66 13 68 C 40 67 57 74 54 91 C 51 106 32 112 6 110" />
          <!-- L -->
          <path data-ch="L" transform="translate(330, 0)"
            d="M 18 34 C 14 58 10 82 7 99 C 5 108 11 111 21 111 C 34 111 45 108 54 102" />
          <!-- E -->
          <path data-ch="E" transform="translate(396, 0)"
            d="M 54 38 C 42 31 24 31 18 37 C 13 43 12 57 12 70 Q 28 68 42 70 Q 28 68 12 70 C 9 85 7 100 13 106 C 22 113 42 111 55 103" />
        </g>

        <!-- Glowing pen-tip point -->
        <g class="sp-nib">
          <circle cx="0" cy="0" r="8.5" fill="url(#sp-nib-grad)" />
          <circle cx="0" cy="0" r="1.9" fill="#ffffff" />
        </g>
      </svg>
    </div>

    <div class="sp-loading" aria-live="polite">
      <div class="sp-load-row">
        <span class="sp-load-text">LOADING</span>
        <span class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>
</div>

<div id="app"></div>
<script type="module" src="/src/main.ts"></script>

<script>
/* The splash leaves the moment the gateway answers — there is no floor. A warm
   start really is fast, and padding the opening to a fixed length makes the
   shell feel slower than it is. MAX is the other end: a gateway that never
   answers must not own the window forever. */
(function () {
  var DRAW_DURATION = 1200
  var MAX = 12000

  var el = document.getElementById('splash')
  if (!el) return

  var onDesktop = '__TAURI_INTERNALS__' in window
  var forced = /[?&]splash=1/.test(location.search)
  if (!onDesktop && !forced) {
    el.remove()
    return
  }

  var shell = el.querySelector('.sp-shell')
  var inkLayer = el.querySelector('.sp-ink-layer')
  var glowLayer = el.querySelector('.sp-glow-layer')
  var nib = el.querySelector('.sp-nib')
  var inkPaths = Array.prototype.slice.call(inkLayer.querySelectorAll('path'))
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches

  var items = inkPaths.map(function (p) {
    var glow = p.cloneNode(false)
    glowLayer.appendChild(glow)
    var len = p.getTotalLength()
    p.style.strokeDasharray = String(len)
    glow.style.strokeDasharray = String(len)
    return { ink: p, glow: glow, len: len }
  })

  var totalLen = items.reduce(function (acc, item) { return acc + item.len }, 0)
  var accLen = 0
  items.forEach(function (item) {
    item.startRatio = accLen / totalLen
    accLen += item.len
    item.endRatio = accLen / totalLen
  })

  var start = performance.now()
  var raf = 0
  var settled = false
  var finished = false
  var writeDone = false

  function applyProgress(progress) {
    var clamped = Math.max(0, Math.min(1, progress))
    var activePoint = null

    for (var i = 0; i < items.length; i++) {
      var item = items[i]
      if (clamped <= item.startRatio) {
        item.ink.style.strokeDashoffset = String(item.len)
        item.glow.style.strokeDashoffset = String(item.len)
      } else if (clamped >= item.endRatio) {
        item.ink.style.strokeDashoffset = '0'
        item.glow.style.strokeDashoffset = '0'
      } else {
        var local = (clamped - item.startRatio) / (item.endRatio - item.startRatio)
        var drawn = local * item.len
        var offset = item.len - drawn
        item.ink.style.strokeDashoffset = String(offset)
        item.glow.style.strokeDashoffset = String(offset)

        var pt = item.ink.getPointAtLength(drawn)
        var tx = 0
        var tr = item.ink.getAttribute('transform') || ''
        var m = /translate\(\s*([-\d.]+)/.exec(tr)
        if (m) tx = parseFloat(m[1]) || 0
        activePoint = { x: pt.x + tx, y: pt.y }
      }
    }

    if (activePoint && clamped > 0 && clamped < 1) {
      nib.setAttribute('transform', 'translate(' + activePoint.x.toFixed(2) + ' ' + activePoint.y.toFixed(2) + ')')
      nib.classList.add('is-active')
    } else {
      nib.classList.remove('is-active')
    }
  }

  function easeInOutSine(t) {
    return -(Math.cos(Math.PI * t) - 1) / 2
  }

  function tick(now) {
    if (finished) return
    var elapsed = now - start
    var raw = Math.min(1, elapsed / DRAW_DURATION)
    var eased = easeInOutSine(raw)
    applyProgress(eased)

    if (raw < 1) {
      raf = requestAnimationFrame(tick)
    } else if (!writeDone) {
      writeDone = true
      shell.classList.add('sp-written')
    }
  }

  function finish() {
    if (finished) return
    finished = true
    cancelAnimationFrame(raf)
    nib.classList.remove('is-active')
    setTimeout(function () { el.classList.add('sp-done') }, 120)
    setTimeout(function () { el.classList.add('sp-out') }, 240)
    setTimeout(function () { el.remove() }, 920)
  }

  function onReady() {
    if (settled) return
    settled = true
    finish()
  }

  window.addEventListener('pebble:gateway-ready', onReady)
  setTimeout(function () {
    if (!settled) { settled = true; finish() }
  }, MAX)

  if (reducedMotion) {
    applyProgress(1)
    writeDone = true
    shell.classList.add('sp-written')
  } else {
    applyProgress(0)
    raf = requestAnimationFrame(tick)
  }
})()
</script>
</body>
</html>
